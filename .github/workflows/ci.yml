name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, test, and build
        run: bun run check

      - name: Test Python parity
        run: PYTHONPATH=python/src python -m unittest discover -s python/tests -v

      - name: Set up Python for Deep Agents SDK
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Test real Deep Agents SDK checkpoint
        shell: bash
        run: |
          python -m pip install ".[deepagents]" "deepagents>=0.6,<0.7"
          DEEPAGENTS_TEST_PYTHON=python DEEPAGENTS_SDK_TEST_PYTHON=python \
            bun test test/deepagents.test.ts test/deepagents-sdk.test.ts
          PYTHONPATH=python/src python -m unittest discover -s python/tests -v

      - name: Pack and install as a consumer
        shell: bash
        run: |
          set -euo pipefail

          pack_json="$RUNNER_TEMP/pack.json"
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$pack_json"
          tarball_name="$(node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(result) || !result[0]?.filename) process.exit(1);
            process.stdout.write(result[0].filename);
          ' "$pack_json")"
          tarball="$RUNNER_TEMP/$tarball_name"
          test -f "$tarball"

          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init --yes > /dev/null
          npm install "$tarball" > /dev/null

          package="node_modules/@letta-ai/trajectory"
          test -f "$package/dist/index.js"
          test -f "$package/dist/index.d.ts"
          test -f "$package/schema/trajectory-v1.schema.json"
          test -f "$package/prompts/add-source.md"

          node --input-type=module <<'NODE'
          import {
            DEFAULT_NORMALIZATION_BOUNDS,
            normalizeTranscript,
          } from "@letta-ai/trajectory";

          const transcript = [
            JSON.stringify({
              type: "response_item",
              payload: {
                type: "message",
                role: "user",
                content: [{ type: "input_text", text: "hello" }],
              },
            }),
            JSON.stringify({
              type: "response_item",
              payload: {
                type: "message",
                role: "assistant",
                content: [{ type: "output_text", text: "hi" }],
              },
            }),
          ].join("\n");

          const result = normalizeTranscript({ source: "codex", transcript });
          if (result.records.length !== 3) {
            throw new Error(`Expected 3 normalized records, got ${result.records.length}.`);
          }
          if (result.records[0]?.role !== "meta" || result.records[0].source !== "codex") {
            throw new Error("Packaged normalizer returned invalid metadata.");
          }
          if (DEFAULT_NORMALIZATION_BOUNDS.toolResults.strategy !== "head-tail") {
            throw new Error("Packaged defaults were not exported correctly.");
          }
          NODE

      - name: Build and install Python wheel
        shell: bash
        run: |
          set -euo pipefail

          wheel_dir="$RUNNER_TEMP/python-wheel"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          wheel=("$wheel_dir"/*.whl)
          test "${#wheel[@]}" -eq 1

          consumer="$RUNNER_TEMP/python-consumer"
          python -m venv "$consumer"
          "$consumer/bin/python" -m pip install --no-deps "${wheel[0]}"

          cd "$RUNNER_TEMP"
          "$consumer/bin/python" <<'PY'
          from pathlib import Path

          import trajectory
          from trajectory import normalize_transcript

          transcript = "\n".join([
              '{"type":"response_item","payload":{"type":"message","role":"user","content":[{"type":"input_text","text":"hello"}]}}',
              '{"type":"response_item","payload":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"hi"}]}}',
          ])
          result = normalize_transcript(source="codex", transcript=transcript)
          assert len(result["records"]) == 3
          assert result["records"][0] == {"role": "meta", "source": "codex"}

          package = Path(trajectory.__file__).parent
          assert (package / "py.typed").is_file()
          assert (package / "_vendor" / "trajectory-cli.mjs").is_file()
          PY
