name: Publish existing release tag

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: trajectory-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tagged npm and PyPI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Dispatch on the tag, not main: npm provenance must identify the same
      # commit as the source being packaged. The tag must contain this workflow.
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is on main and matches the dispatch commit
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+\.[0-9]+)?$ ]]; then
            echo 'Dispatch this workflow on an existing version tag, not a branch.' >&2
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Tag $TAG does not exist; this workflow never creates tags." >&2
            exit 1
          }
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [[ "$commit" != "$GITHUB_SHA" ]] || [[ "$commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag $TAG does not match the dispatched commit; refusing to publish." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "Tag $TAG is not reachable from main; refusing to publish." >&2
            exit 1
          }
          echo "Publishing source from $TAG at $commit"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      # Fail closed if the registry cannot be read. A missing npm version may be
      # published, but never move an existing latest/prerelease dist-tag backward.
      - name: Validate the tag and plan npm publication
        id: plan
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            'https://registry.npmjs.org/@letta-ai%2ftrajectory' \
            --output "$RUNNER_TEMP/npm-registry.json"
          python3 scripts/plan-tag-publish.py \
            "${GITHUB_REF#refs/tags/}" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/npm-registry.json" \
            >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tagged source (typecheck, test, build)
        run: bun run check

      - name: Verify Python parity
        run: PYTHONPATH=python/src python -m unittest discover -s python/tests -v

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist-python
          python -m twine check --strict dist-python/*

      - name: Publish missing npm version
        if: steps.plan.outputs.publish_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"

      # A previous attempt can have uploaded only one of the wheel and sdist.
      - name: Publish missing PyPI distributions
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist-python/*
